<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body style="
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #cbd5f5, #c7d2fe);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
">

<div style="
    background:#f3f4f6;
    padding:30px;
    border-radius:15px;
    width:420px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    text-align:center;
">

    <h2 style="
        color:#4f46e5;
        font-size:22px;
        margin-bottom:5px;
    ">
        🤖 AI-Based Study Assistant
    </h2>

    <p style="
        color:#555;
        font-size:14px;
        margin-bottom:20px;
    ">
        Login to Continue
    </p>

    <form action="/login" method="POST">
        
        <input type="email" name="email" placeholder="Email Address" required 
               style="
               width:100%;
               padding:12px;
               margin:8px 0;
               font-size:14px;
               border-radius:8px;
               border:1px solid #ccc;
               outline:none;
               ">

        <input type="password" name="password" placeholder="Password" required 
               style="
               width:100%;
               padding:12px;
               margin:8px 0;
               font-size:14px;
               border-radius:8px;
               border:1px solid #ccc;
               outline:none;
               ">

        <button type="submit" 
                style="
                width:100%;
                padding:12px;
                font-size:15px;
                background:#4f46e5;
                color:white;
                border:none;
                border-radius:8px;
                cursor:pointer;
                margin-top:10px;
                ">
            Login
        </button>
    </form>

    {% if error %}
    <p style="color:red; margin-top:10px;">
        ❌ {{ error }}
    </p>
    {% endif %}

    <p style="
        margin-top:15px;
        font-size:13px;
        color:#333;
    ">
        Don’t have an account? 
        <a href="/signup_page" style="color:#4f46e5; text-decoration:none;">
            Sign Up
        </a>
    </p>

</div>

</body>
</html>
