

  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - AI-Based Study Assistant</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background: linear-gradient(to right, #fbc2eb, #a6c1ee); display:flex; justify-content:center; align-items:center; height:100vh;">

<div style="background:white; padding:35px; border-radius:15px; width:400px; box-shadow:0 15px 30px rgb(151, 199, 205); text-align:center;">

    <h2 style="color:#6d28d9;">📚 AI-Based Study Assistant</h2>
    
    <!-- This shows the name of the person logged in from the database -->
    <p style="color:gray; margin-top:-10px;">Hello, <b>{{ session['user_name'] }}</b>!</p>
    <p style="color:gray; font-size: 14px;">Upload your PDF to start the AI analysis.</p>

    <!-- The FORM that talks to Python (app.py) -->
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required style="margin:20px 0; border: 1px dashed #6d28d9; padding: 10px; width: 80%; border-radius: 10px;">
        <br>
        <button type="submit" style="padding:10px 20px; border:none; border-radius:8px; background:#6d28d9; color:white; font-size:16px; cursor:pointer; width: 100%;">
            Upload & Process PDF
        </button>
    </form>

    <br>
    <!-- Logout button redirects to the logout route in Python -->
    <a href="/logout" style="text-decoration:none;">
        <button style="padding:8px 15px; border:none; border-radius:8px; background:red; color:white; cursor:pointer; width: 100%;">Logout</button>
    </a>

</div>

</body>
</html>
